# SIT base configuration
# All latency values in microseconds (us) - the canonical unit.

seed: 123
strict_mode: true
latency_unit: "us"
slo_us: 500000
n_trials: 10
output_dir: "data"
export_format: "parquet"

schedulers:
  - "random"

regimes:
  mode: "synthetic"
  n_regimes: 2

logging:
  level: "INFO"
