# SIT tomography smoke configuration
# Small problem for end-to-end pipeline validation.

seed: 42
strict_mode: false
latency_unit: "us"
slo_us: 500000
n_trials: 10
output_dir: "data"
export_format: "parquet"

schedulers:
  - "measurement_harness"

regimes:
  mode: "synthetic"
  n_regimes: 1

logging:
  level: "INFO"

sim:
  n_targets: 3
  n_spectators: 15
  n_regimes: 1
  n_samples_per_micro_run: 1000

  drift:
    type: "linear"
    a_us_per_step: 30.0

  channels:
    weights:
      LLC: 1.0
      MEM_BW: 1.2
      IO: 0.7
      TLB: 0.5
      SMT: 0.6
    scale_us: 100.0

  toxic_pairs:
    enabled: true
    sparsity: 0.10
    lognormal_mu: 0.5
    lognormal_sigma: 0.7

  queue:
    enabled: true
    concurrency: 16
    think_time_us: 50.0

  burst:
    enabled: true
    p_burst: 0.002
    pareto_alpha: 2.5
    scale_us: 5000.0

  interactions:
    enabled: false
    gamma: 0.01

measurement:
  alpha: 0.99
  ci_resamples: 200
  block_bootstrap: false
  block_size: null
  n_irbs_pairs: 3
  irbs:
    drift_order: 1
    design: "CTC"

tomography:
  n_samples_tomo: 5000
  probe:
    strategy: "coverage_aware"
    m_probes: 80
    set_size: 3
    max_repeats: 25
  stat: "mean"
  use_irbs: true
  solver:
    lambda_1: 0.001
    lambda_2: 0.001
    max_iter: 5000
    cross_validate: false
  diagnostics:
    enabled: true
    max_cond: 100.0
    min_coverage: 1.0
    max_coherence: 0.99
    mitigate: true
    extra_probes: 20
  uncertainty:
    enabled: true
    n_resamples: 100
    alpha: 0.05
  gates:
    target_topk_recall: 0.95
    target_ndcg: 0.95
    max_relative_l2: 0.10
