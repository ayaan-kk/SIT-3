# SIT statistical validation smoke configuration
# Runs CI calibration, EVT diagnostics, regime effects, FDR control,
# and robustness sweeps with small parameters for quick validation.

seed: 123
strict_mode: true
latency_unit: "us"
slo_us: 500000
n_trials: 10
output_dir: "data"
export_format: "parquet"

schedulers:
  - "measurement_harness"

regimes:
  mode: "synthetic"
  n_regimes: 2

logging:
  level: "INFO"

run_mode: "stats"
base_pipeline: "load"

sim:
  n_targets: 5
  n_spectators: 20
  n_regimes: 2
  n_samples_per_micro_run: 2000

  drift:
    type: "linear"
    a_us_per_step: 50.0

  channels:
    weights:
      LLC: 1.0
      MEM_BW: 1.2
      IO: 0.7
      TLB: 0.5
      SMT: 0.6
    scale_us: 100.0

  toxic_pairs:
    enabled: true
    sparsity: 0.05
    lognormal_mu: 0.0
    lognormal_sigma: 0.7

  queue:
    enabled: true
    concurrency: 16
    think_time_us: 50.0

  burst:
    enabled: true
    p_burst: 0.002
    pareto_alpha: 2.5
    scale_us: 5000.0

  interactions:
    enabled: false
    gamma: 0.01

measurement:
  alpha: 0.99
  ci_resamples: 200
  block_bootstrap: true
  block_size: 64
  n_irbs_pairs: 5
  irbs:
    drift_order: 1
    design: "CTC"

stats:
  ci:
    enabled: true
    nominal: 0.95
    repeats: 50
    bootstrap_resamples: 1000
    reference_multiplier: 10
    n_samples_base: 5000
  evt:
    enabled: true
    threshold_quantiles: [0.90, 0.92, 0.94, 0.95]
    min_exceedances: 5
  effects:
    baseline: "measurement_harness"
    test: "wilcoxon"
    fdr_q: 0.10
  robustness:
    enabled: true
    beta_grid: [0.5, 1.0, 2.0]
    lambda_grid: [0.2, 0.5, 1.0]
    tau_grid_us: [1500000, 2000000, 3000000]

gates:
  enable: true
  min_coverage: 0.90
  fdr_q: 0.10
  evt_required: false
