# SIT simulator full configuration
# Larger simulation for thorough evaluation.

seed: 42
strict_mode: false
latency_unit: "us"
slo_us: 500000
n_trials: 50
output_dir: "data"
export_format: "parquet"

schedulers:
  - "measurement_harness"

regimes:
  mode: "synthetic"
  n_regimes: 4

logging:
  level: "INFO"

sim:
  n_targets: 10
  n_spectators: 50
  n_regimes: 4
  n_samples_per_micro_run: 5000

  drift:
    type: "linear"
    a_us_per_step: 50.0

  channels:
    weights:
      LLC: 1.0
      MEM_BW: 1.2
      IO: 0.7
      TLB: 0.5
      SMT: 0.6
    scale_us: 100.0

  toxic_pairs:
    enabled: true
    sparsity: 0.05
    lognormal_mu: 0.0
    lognormal_sigma: 0.7

  queue:
    enabled: true
    concurrency: 16
    think_time_us: 50.0

  burst:
    enabled: true
    p_burst: 0.002
    pareto_alpha: 2.5
    scale_us: 5000.0

  interactions:
    enabled: false
    gamma: 0.01

measurement:
  alpha: 0.99
  ci_resamples: 500
  block_bootstrap: true
  block_size: 64
  n_irbs_pairs: 20
  irbs:
    drift_order: 1
    design: "CTC"
