# SIT hardware validation smoke configuration
# Runs real workloads on the local machine to validate:
#   - Baseline drift exists (Gate H1)
#   - IRBS reduces bias vs naive (Gate H2)
#   - Simulator rankings transfer to hardware (Gate H3)
#
# Requirements: single Linux machine, no root required.
# Counters degrade gracefully if perf is unavailable.

seed: 123
strict_mode: false
latency_unit: "us"
slo_us: 500000
n_trials: 10
output_dir: "data"
export_format: "parquet"

schedulers:
  - "measurement_harness"

regimes:
  mode: "synthetic"
  n_regimes: 2

logging:
  level: "INFO"

run_mode: "hardware"

# Simulator config (for transfer comparison)
sim:
  n_targets: 3
  n_spectators: 10
  n_regimes: 2
  n_samples_per_micro_run: 2000

  drift:
    type: "linear"
    a_us_per_step: 50.0

  channels:
    weights:
      LLC: 1.0
      MEM_BW: 1.2
      IO: 0.7
      TLB: 0.5
      SMT: 0.6
    scale_us: 100.0

  toxic_pairs:
    enabled: true
    sparsity: 0.05
    lognormal_mu: 0.0
    lognormal_sigma: 0.7

  queue:
    enabled: false
    concurrency: 16
    think_time_us: 50.0

  burst:
    enabled: false
    p_burst: 0.002
    pareto_alpha: 2.5
    scale_us: 5000.0

  interactions:
    enabled: false
    gamma: 0.01

measurement:
  alpha: 0.99
  ci_resamples: 200
  block_bootstrap: false
  block_size: 64
  n_irbs_pairs: 3
  irbs:
    drift_order: 1
    design: "CTC"

# Hardware experiment configuration
hardware:
  target:
    type: "rpc_loop"
    duration_s: 5
    warmup_s: 1
    work_size: 64
    n_requests: 500
    warmup_requests: 100

  spectators:
    - type: "cpu_burn"
      intensity: 0.8
    - type: "mem_burn"
      intensity: 0.8
    - type: "cache_burn"
      intensity: 0.8

  repeats_per_condition: 3

  irbs:
    enabled: true
    stat: "p99"

  counters:
    enabled: true

  gates:
    require_drift: true
    require_irbs_benefit: true
    require_rank_transfer: true
