# SIT probe efficiency full configuration
# Larger problem for comprehensive probe evaluation.

seed: 42
strict_mode: true
latency_unit: "us"
slo_us: 500000
n_trials: 20
output_dir: "data"
export_format: "parquet"

schedulers:
  - "probe_harness"

regimes:
  mode: "synthetic"
  n_regimes: 4

logging:
  level: "INFO"

sim:
  n_targets: 10
  n_spectators: 80
  n_regimes: 4
  n_samples_per_micro_run: 2000

  drift:
    type: "linear"
    a_us_per_step: 50.0

  channels:
    weights:
      LLC: 1.0
      MEM_BW: 1.2
      IO: 0.7
      TLB: 0.5
      SMT: 0.6
    scale_us: 20.0

  toxic_pairs:
    enabled: true
    sparsity: 0.08
    lognormal_mu: 0.0
    lognormal_sigma: 0.7

  queue:
    enabled: true
    concurrency: 16
    think_time_us: 50.0

  burst:
    enabled: true
    p_burst: 0.002
    pareto_alpha: 2.5
    scale_us: 5000.0

  interactions:
    enabled: false
    gamma: 0.01

measurement:
  stat: "cvar99"
  alpha: 0.99
  use_irbs: true
  ci_resamples: 500
  block_bootstrap: true
  block_size: 64
  n_irbs_pairs: 3
  irbs:
    drift_order: 1
    design: "CTC"

tomography:
  n_samples_tomo: 5000
  set_size: 3
  stat: "mean"
  use_irbs: true
  solver:
    lambda1: 0.05
    lambda2: 0.01
    max_iter: 5000
  probe:
    strategy: "coverage_aware"
    m_probes: 200
    set_size: 3
    max_repeats: 40
  diagnostics:
    enabled: true
    max_cond: 100.0
    min_coverage: 1.0
    max_coherence: 0.99
    mitigate: true
    extra_probes: 30
  uncertainty:
    enabled: true
    n_resamples: 200
    alpha: 0.05
  gates:
    target_topk_recall: 0.95
    target_ndcg: 0.95
    max_relative_l2: 0.10

probing:
  m_total: 400
  checkpoints_every: 10
  policies:
    - "random"
    - "coverage"
    - "uncertainty"
    - "diversity"
    - "sit_active"
  kernel:
    type: "rbf"
    sigma: 0.3
    epsilon: 0.000001
  hybrid_lambda: 0.5
  max_repeats_per_spectator: 40

gates:
  enable: true
  efficiency_ratio: 0.60
  recall: 0.95
  ndcg: 0.95
  diversity_ratio: 0.85
  replay_required: true
